{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock title %}</title>

    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Site CSS -->
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    {% block extra_head %}{% endblock extra_head %}
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse p-3">
            <h4 class="mb-4">Dashboard</h4>
            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a class="nav-link" href="{% url 'dashboard_home' %}">
                        <i class="fas fa-home me-2"></i> Home
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" href="{% url 'post_list' %}">
                        <i class="fas fa-newspaper me-2"></i> Blog Posts
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link" href="{% url 'post_create' %}">
                        <i class="fas fa-plus me-2"></i> Add Post
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% block dashboard_content %}{% endblock dashboard_content %}
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock extra_js %}
</body>
</html>
