{% extends "blog/dashboard/base_dashboard.html" %}

{% block title %}Edit RSVP Entry{% endblock title %}

{% block content %}
<div class="container-fluid p-0">
    <div class="mb-4">
        <a href="{% url 'rsvp_dashboard' %}" class="text-decoration-none text-muted">
            <i class="fas fa-arrow-left me-1"></i> Back to RSVPs
        </a>
        <h3 class="fw-bold text-dark mb-0 mt-2">Edit Attendee Record</h3>
    </div>

    <div class="card border-0 shadow-sm" style="max-width: 750px;">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">First Name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ form.first_name.value }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Last Name</label>
                        <input type="text" name="last_name" class="form-control" value="{{ form.last_name.value }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ form.email.value }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ form.phone.value }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Organization / Company</label>
                        <input type="text" name="company" class="form-control" value="{{ form.company.value }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Job Title</label>
                        <input type="text" name="job_title" class="form-control" value="{{ form.job_title.value|default:'' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Attendance Confirmation</label>
                        <select name="attendance" class="form-select" required>
                            <option value="yes" {% if form.attendance.value == 'yes' %}selected{% endif %}>Yes, Attending</option>
                            <option value="no" {% if form.attendance.value == 'no' %}selected{% endif %}>Declined</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Dietary / Special Requirements</label>
                        <textarea name="dietary_requirements" class="form-control" rows="3">{{ form.dietary_requirements.value|default:'' }}</textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'rsvp_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary text-white">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
